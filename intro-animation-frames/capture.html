<!doctype html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ValidPlan Intro Capture</title>
    <style>
      :root {
        color-scheme: dark;
        --blueprint-bg: #06224a;
        --blueprint-line: rgba(255, 255, 255, 0.08);
        --blueprint-line-strong: rgba(255, 255, 255, 0.15);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
        background:
          linear-gradient(90deg, var(--blueprint-line) 1px, transparent 1px),
          linear-gradient(0deg, var(--blueprint-line) 1px, transparent 1px),
          linear-gradient(90deg, var(--blueprint-line-strong) 1px, transparent 1px),
          linear-gradient(0deg, var(--blueprint-line-strong) 1px, transparent 1px),
          radial-gradient(circle at 32% 36%, rgba(18, 132, 255, 0.22), transparent 36%),
          radial-gradient(circle at 72% 28%, rgba(30, 94, 210, 0.18), transparent 34%),
          linear-gradient(135deg, #071a34 0%, var(--blueprint-bg) 46%, #0a3571 100%);
        background-size:
          24px 24px,
          24px 24px,
          120px 120px,
          120px 120px,
          auto,
          auto,
          auto;
      }

      .intro-capture {
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 48px;
      }

      .intro-stage {
        display: grid;
        width: min(1040px, calc(100vw - 72px));
        aspect-ratio: 2036 / 913;
        place-items: center;
      }

      .intro-logo-host,
      .intro-logo-host svg {
        display: block;
        width: 100%;
        height: 100%;
      }

      .intro-logo-host {
        filter: drop-shadow(0 18px 48px rgba(0, 112, 255, 0.2));
      }

      .intro-logo-host #valiMaskRect,
      .intro-logo-host #dLetterMaskRect,
      .intro-logo-host #dExtensionPath,
      .intro-logo-host #planMaskRect,
      .intro-logo-host #swooshMaskPath {
        animation-fill-mode: both !important;
        animation-play-state: paused !important;
      }

      .intro-logo-host #valiMaskRect {
        animation-delay: calc(0s - var(--capture-time, 0s)) !important;
      }

      .intro-logo-host #dLetterMaskRect {
        animation-delay: calc(0.56s - var(--capture-time, 0s)) !important;
      }

      .intro-logo-host #dExtensionPath {
        animation-delay: calc(0.86s - var(--capture-time, 0s)) !important;
      }

      .intro-logo-host #planMaskRect {
        animation-delay: calc(1.58s - var(--capture-time, 0s)) !important;
      }

      .intro-logo-host #swooshMaskPath {
        animation-delay: calc(2.12s - var(--capture-time, 0s)) !important;
      }
    </style>
  </head>
  <body>
    <main class="intro-capture" aria-label="ValidPlan intro animation capture">
      <div class="intro-stage">
        <div id="introLogoHost" class="intro-logo-host" aria-label="ValidPlan animált logó"></div>
      </div>
    </main>

    <script>
      const params = new URLSearchParams(window.location.search);
      const captureTime = Number.parseFloat(params.get("t") || "0");
      document.documentElement.style.setProperty("--capture-time", `${Math.max(0, captureTime)}s`);

      fetch("../logo-validplan-animated.svg?v=20260903-final-intro-1")
        .then((response) => response.text())
        .then((svg) => {
          document.getElementById("introLogoHost").innerHTML = svg.replaceAll(
            'href="logo-validplan-new.png"',
            'href="../logo-validplan-new.png"',
          );
          document.body.dataset.ready = "true";
        });
    </script>
  </body>
</html>
