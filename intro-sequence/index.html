<!doctype html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ValidPlan Intro Sequence</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 32px;
        color: #e7f7ff;
        background: #062554;
        font-family: Arial, sans-serif;
      }

      h1 {
        margin: 0 0 24px;
        font-size: 28px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 22px;
      }

      figure {
        margin: 0;
        border: 1px solid rgba(201, 244, 255, 0.24);
        border-radius: 8px;
        background: rgba(3, 25, 58, 0.72);
        overflow: hidden;
      }

      img {
        display: block;
        width: 100%;
        height: auto;
      }

      figcaption {
        padding: 12px 14px;
        color: #c9f4ff;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.03em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <h1>ValidPlan intro animacio - kepkockak</h1>
    <main class="grid">
      <figure>
        <img src="01-blank-start.png?v=20260903-sequence-animation-1" alt="01 blank start" />
        <figcaption>01 blank start</figcaption>
      </figure>
      <figure>
        <img src="02-vali-writing.png?v=20260903-sequence-animation-1" alt="02 Vali writing" />
        <figcaption>02 Vali writing</figcaption>
      </figure>
      <figure>
        <img src="03-d-appears.png?v=20260903-sequence-animation-1" alt="03 d appears" />
        <figcaption>03 d appears</figcaption>
      </figure>
      <figure>
        <img src="04-d-extension.png?v=20260903-sequence-animation-1" alt="04 d extension" />

      </figure>
      <figure>
        <img src="04a-d-extension-start.png?v=20260903-sequence-animation-1" alt="04a d extension start" />
        <figcaption>04a d extension start</figcaption>
      </figure>
      <figure>
        <img src="04b-d-stem-rising.png?v=20260903-sequence-animation-1" alt="04b d stem rising" />
        <figcaption>04b d stem rising</figcaption>
      </figure>
      <figure>
        <img src="04c-d-top-turn.png?v=20260903-sequence-animation-1" alt="04c d top turn" />
        <figcaption>04c d top turn</figcaption>
      </figure>
      <figure>
        <img src="04d-half-rectangle-trace.png?v=20260903-sequence-animation-1" alt="04d half rectangle trace" />

    </main>
  </body>
</html>
