<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2036 913" role="img" aria-labelledby="validplanLogoTitle">
  <title id="validplanLogoTitle">ValidPlan animated logo</title>
  <defs>
    <style>
      .logo-source {
        opacity: 1;
      }

      .reveal-mask {
        transform-box: fill-box;
        transform-origin: left center;
        transform: scaleX(0);
        animation-fill-mode: forwards;
        animation-timing-function: ease-in-out;
      }

      #valiMaskRect {
        animation-name: revealMask;
        animation-duration: 0.58s;
      }

      #dLetterMaskRect {
        animation-name: revealMask;
        animation-duration: 0.32s;
        animation-delay: 0.56s;
      }

      .d-extension-main {
        opacity: 1;
        stroke-dasharray: 1;
        stroke-dashoffset: 1;
        animation-fill-mode: forwards;
        animation-timing-function: ease-in-out;
      }

      #dExtensionPath {
        animation-name: traceExtension;
        animation-duration: 0.72s;
        animation-delay: 0.86s;
      }

      #planMaskRect {
        animation-name: revealMask;
        animation-duration: 0.58s;
        animation-delay: 1.58s;
      }

      #swooshMaskPath {
        stroke-dasharray: 1850;
        stroke-dashoffset: 1850;
        animation: traceSwoosh 0.72s ease-in-out 2.12s forwards;
      }

      @keyframes revealMask {
        to { transform: scaleX(1); }
      }

      @keyframes traceExtension {
        to { stroke-dashoffset: 0; }
      }

      @keyframes traceSwoosh {
        to { stroke-dashoffset: 0; }
      }

      @media (prefers-reduced-motion: reduce) {
        .reveal-mask {
          transform: none;
          animation: none;
        }

      #dExtensionPath,
      #swooshMaskPath {
          stroke-dashoffset: 0;
          animation: none;
        }
      }
    </style>

    <clipPath id="valiClip">
      <rect x="0" y="500" width="786" height="413" />
    </clipPath>

    <clipPath id="dLetterClip">
      <rect x="772" y="500" width="306" height="413" />
    </clipPath>

    <clipPath id="planClip">
      <rect x="1075" y="500" width="961" height="413" />
    </clipPath>

    <mask id="valiMask" maskUnits="userSpaceOnUse">
      <rect id="valiMaskRect" class="reveal-mask" x="0" y="500" width="786" height="413" fill="#fff" />
    </mask>

    <mask id="dLetterMask" maskUnits="userSpaceOnUse">
      <rect id="dLetterMaskRect" class="reveal-mask" x="772" y="500" width="306" height="413" fill="#fff" />
    </mask>

    <mask id="planMask" maskUnits="userSpaceOnUse">
      <rect id="planMaskRect" class="reveal-mask" x="1075" y="500" width="961" height="413" fill="#fff" />
    </mask>

    <mask id="swooshMask" maskUnits="userSpaceOnUse">
      <path
        id="swooshMaskPath"
        d="M140 520 C470 280 1580 280 1906 520"
        fill="none"
        stroke="#fff"
        stroke-width="120"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </mask>

  </defs>

  <g clip-path="url(#valiClip)" mask="url(#valiMask)">
    <image class="logo-source" href="logo-validplan-new.png" x="0" y="0" width="2036" height="913" />
  </g>

  <g clip-path="url(#dLetterClip)" mask="url(#dLetterMask)">
    <image class="logo-source" href="logo-validplan-new.png" x="0" y="0" width="2036" height="913" />
  </g>

  <path
    id="dExtensionPath"
    class="d-extension-main"
    pathLength="1"
    d="M1024 500 V175 H810 V500"
    fill="none"
    stroke="#0070ff"
    stroke-width="60"
    stroke-linecap="square"
    stroke-linejoin="miter"
  />

  <g clip-path="url(#planClip)" mask="url(#planMask)">
    <image class="logo-source" href="logo-validplan-new.png" x="0" y="0" width="2036" height="913" />
  </g>

  <path
    id="swooshShape"
    d="M140 520 C470 282 1580 282 1906 520 C1515 398 525 398 140 520 Z"
    fill="#0070ff"
    mask="url(#swooshMask)"
  />
</svg>
